# XcodeGen の設定。`scripts/generate.sh` で RouteDance.xcodeproj を作る（.xcodeproj はGit管理しない）。
# 対応OS（既定 iOS 27 / macOS 27）と署名チームは、scripts/generate.sh が環境変数で渡す。
name: RouteDance

options:
  bundleIdPrefix: dev.xeramiya
  deploymentTarget:
    iOS: ${DEPLOYMENT_IOS}
    macOS: ${DEPLOYMENT_MACOS}
  createIntermediateGroups: true
  developmentLanguage: ja

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  RouteDanceCore:
    path: Packages/RouteDanceCore

targets:
  RouteDance-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
      - path: App/iOS
      # 深度モデル（Tools/ModelConversion で生成。Git管理外）。Xcodeがビルド時に .mlmodelc にコンパイルする。
      - path: Models/MoGe2S.mlpackage
        optional: true
      - path: Models/MoGe2S_landscape.mlpackage
        optional: true
      # 超広角の縦持ち（9:16）と横持ち（16:9）を、クロップせずに入れるためのモデル。
      - path: Models/MoGe2S_9x16.mlpackage
        optional: true
      - path: Models/MoGe2S_16x9.mlpackage
        optional: true
    dependencies:
      - package: RouteDanceCore
        product: RouteDanceCore
      - package: RouteDanceCore
        product: RouteDancePerception
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: RouteDance
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        NSCameraUsageDescription: 周囲の歩行者を検出して、ぶつからない経路を表示するためにカメラを使います。映像は端末の外に送信しません。
        NSPhotoLibraryUsageDescription: 撮影済みの動画を読み込んで、経路予測の動作を確認するために使います。
        NSMotionUsageDescription: 歩行中の端末の向きと回転を推定するために使います。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xeramiya.routedance
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: RouteDance

  RouteDance-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
      - path: App/macOS
      # 深度モデル（Tools/ModelConversion で生成。Git管理外）。Xcodeがビルド時に .mlmodelc にコンパイルする。
      - path: Models/MoGe2S.mlpackage
        optional: true
      - path: Models/MoGe2S_landscape.mlpackage
        optional: true
      # 超広角の縦持ち（9:16）と横持ち（16:9）を、クロップせずに入れるためのモデル。
      - path: Models/MoGe2S_9x16.mlpackage
        optional: true
      - path: Models/MoGe2S_16x9.mlpackage
        optional: true
    dependencies:
      - package: RouteDanceCore
        product: RouteDanceCore
      - package: RouteDanceCore
        product: RouteDancePerception
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: RouteDance
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xeramiya.routedance.mac
        PRODUCT_NAME: RouteDance
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/macOS/RouteDance.entitlements
      configs:
        # Debugはサンドボックスなし（任意のパスの動画を開く・結果を書き出す開発用）。
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/macOS/RouteDanceDebug.entitlements

schemes:
  RouteDance-iOS:
    build:
      targets:
        RouteDance-iOS: all
    run:
      config: Debug
  RouteDance-macOS:
    build:
      targets:
        RouteDance-macOS: all
    run:
      config: Debug
    test:
      config: Debug
